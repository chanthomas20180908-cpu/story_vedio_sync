<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>女儿国旧日神事件 - 连环画分镜</title>
  <style>
    :root {
      --ink: #f1e7cf;
      --muted: #9f9278;
      --line: #51472f;
      --gold: #d4a94f;
      --red: #d95b43;
      --green: #7ea96f;
      --paper: #17160f;
      --panel: #232014;
      --black: #0c0c08;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; background: var(--black); }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", serif;
      background:
        linear-gradient(90deg, rgba(212,169,79,.045) 1px, transparent 1px),
        linear-gradient(rgba(212,169,79,.04) 1px, transparent 1px),
        radial-gradient(circle at 50% 0, rgba(217,91,67,.09), transparent 42rem),
        #10100b;
      background-size: 38px 38px, 38px 38px, auto, auto;
    }

    a { color: #8fc7cf; text-decoration: none; }

    .page {
      width: min(1500px, calc(100vw - 36px));
      margin: 0 auto;
      padding: 26px 0 54px;
    }

    .cover {
      min-height: 78vh;
      border: 1px solid var(--line);
      padding: 34px;
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(360px, .58fr);
      gap: 28px;
      align-items: stretch;
      background:
        linear-gradient(135deg, rgba(35,32,20,.98), rgba(10,10,7,.98)),
        var(--paper);
      box-shadow: 0 24px 90px rgba(0,0,0,.45), inset 0 0 0 1px rgba(241,231,207,.04);
    }

    .cover::before {
      content: "混搭档案";
      position: absolute;
      opacity: 0;
    }

    .cover-text {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 26px;
    }

    .kicker {
      color: var(--gold);
      font-size: 13px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 900px;
      font-size: clamp(42px, 6vw, 88px);
      line-height: .98;
      font-weight: 900;
    }

    .lead {
      max-width: 760px;
      margin: 18px 0 0;
      color: #d6c8aa;
      font-size: 22px;
      line-height: 1.75;
    }

    .cover-art {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
    }

    .cover-art img,
    .cover-art video {
      width: 100%;
      height: 100%;
      min-height: 220px;
      object-fit: cover;
      border: 1px solid var(--line);
      background: #090907;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 14px 0 30px;
    }

    .sum {
      border: 1px solid var(--line);
      background: rgba(35,32,20,.86);
      padding: 14px;
    }

    .sum strong {
      display: block;
      color: var(--gold);
      font-size: 26px;
      line-height: 1;
    }

    .sum span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .reader-note {
      border: 1px solid var(--line);
      background: rgba(35,32,20,.78);
      padding: 18px 20px;
      margin: 14px 0 28px;
      color: #dbcdae;
      font-size: 18px;
      line-height: 1.72;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 12px 0;
      background: linear-gradient(#10100b 72%, rgba(16,16,11,0));
    }

    .nav a {
      border: 1px solid var(--line);
      background: rgba(35,32,20,.94);
      color: var(--ink);
      padding: 8px 10px;
      font-size: 13px;
    }

    .nav a:hover {
      border-color: var(--gold);
      color: #ffe4a0;
    }

    .chapter {
      margin-top: 30px;
      border: 1px solid var(--line);
      background: rgba(17,17,11,.82);
    }

    .chapter-head {
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(0,0,0,.32);
    }

    .act-label {
      color: var(--red);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .16em;
    }

    .act-range { color: var(--muted); font-size: 12px; }
    .act-time { color: var(--gold); font-size: 12px; }

    .strip {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0;
    }

    .frame {
      min-height: 480px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .frame-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border-bottom: 1px solid rgba(81,71,47,.82);
      background: rgba(0,0,0,.2);
    }

    .id {
      color: var(--gold);
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
    }

    .time {
      color: #e8dcc2;
      border: 1px solid var(--line);
      padding: 3px 6px;
      font-size: 12px;
      background: rgba(0,0,0,.28);
    }

    .picture {
      position: relative;
      aspect-ratio: 9 / 16;
      margin: 10px 10px 0;
      border: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(217,91,67,.1), rgba(126,169,111,.08)),
        #0a0a07;
      overflow: hidden;
    }

    .picture img,
    .picture video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .missing {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 18px;
      text-align: center;
      color: #d6c8aa;
      line-height: 1.7;
      font-size: 16px;
      background:
        linear-gradient(45deg, rgba(212,169,79,.04) 25%, transparent 25% 50%, rgba(212,169,79,.04) 50% 75%, transparent 75%),
        #10100b;
      background-size: 18px 18px;
    }

    .tag {
      position: absolute;
      left: 8px;
      bottom: 8px;
      border: 1px solid rgba(212,169,79,.62);
      background: rgba(8,8,5,.74);
      color: #d6c8aa;
      padding: 4px 6px;
      font-size: 11px;
    }

    .caption {
      padding: 13px 14px 16px;
      min-height: 150px;
      background:
        linear-gradient(180deg, rgba(241,231,207,.025), transparent),
        rgba(0,0,0,.12);
    }

    .caption p {
      margin: 0;
      color: #f1e7cf;
      font-size: 17px;
      line-height: 1.72;
    }

    .caption .dialogue {
      display: block;
      margin-top: 8px;
      color: #ffe5a3;
      font-size: 20px;
      font-weight: 900;
    }

    .turn {
      color: var(--red);
      font-weight: 900;
    }

    .end-note {
      margin-top: 28px;
      border: 1px solid var(--line);
      background: rgba(35,32,20,.86);
      padding: 18px;
      color: #d6c8aa;
      line-height: 1.72;
    }

    @media (max-width: 980px) {
      .cover { grid-template-columns: 1fr; min-height: 0; }
      .summary { grid-template-columns: repeat(2, 1fr); }
      .chapter-head { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .page { width: min(100vw - 18px, 1500px); padding-top: 10px; }
      .cover { padding: 18px; }
      .summary { grid-template-columns: 1fr; }
      .strip { grid-template-columns: 1fr; }
      .frame { min-height: 0; }
    }
  </style>
</head>
<body>
  <main class="page">

    <nav class="nav">
      <a href="#act1">起（A01–A10）</a>
      <a href="#act2">困（A11–A22）</a>
      <a href="#act3">破（A23–A32）</a>
    </nav>

    <div id="chapters"></div>

    <section class="end-note">
      故事到这里并没有结束。那个影子第一个知道西天是什么，所以它跑了。它现在还在外面，贴着八戒，一路往西走。
    </section>
  </main>

  <script>
    const ASSET = "../data/Data_results/picture_results/video_episode_002_womankingdom_cthulhu_v1/";
    const VIDEO = "../data/Data_results/video_results/";
    const img = {
      board: ASSET + "references/visual_board_tianshu_style.png",
      chars: ASSET + "references/character_turnaround_sheet.png",
      shadow: ASSET + "keyframes/shot_01_bajie_shadow_escape.png",
      tang: ASSET + "keyframes/shot_02_tangseng_wrong_scripture.png",
      river: ASSET + "keyframes/shot_03_zimu_river_black_sea.png",
      scripture: ASSET + "r2v_refs_tangseng_wrong_scripture/ref_03_scripture.png",
      lantern: ASSET + "r2v_refs_tangseng_wrong_scripture/ref_05_lantern.png",
      ink: ASSET + "r2v_refs_tangseng_wrong_scripture/ref_06_ink_shadow.png",
      hh005: VIDEO + "happyhorse_womankingdom_r2v_test_20260603_001/35402056-metadata_video_720p_5e86ca71-7a86-4fdc-96d6-938d4cefbc7c_refiner.mp4"
    };

    const acts = [
      {
        id: "act1",
        label: "起",
        range: "A01–A10",
        time: "0–30s",
        frames: [
          ["A01", "0-2s",   "",             "话说夜宴散了，师徒四人并肩出了宫门。夜风无声。月光落地，四人影子里，有一个方向不对。",                         "宫门月夜出场"],
          ["A02", "2-4s",   img.shadow,     "八戒走了几步，停住。脚下黑影不停，贴着石阶往宫墙根去了。",                                                         "八戒影子脱离"],
          ["A03", "4-6s",   "",             "沙僧拉了拉八戒，指着石阶道：<span class='dialogue'>二师兄，你脚底下。</span>八戒低头看了半天，没说话。",            "黑影贴地逃走"],
          ["A04", "6-8s",   "",             "子母河边，月亮在天上是白的，映在水里是黑的。",                                                                     "女儿国夜景"],
          ["A05", "8-10s",  img.hh005,      "子母河从水中央开始变黑，慢慢往两岸走。荷叶无风自动。",                                                             "子母河发黑"],
          ["A06", "10-12s", "",             "沙僧捞起一把水，看了看，闻了闻，倒回去，道：<span class='dialogue'>水里有别的东西。</span>",                        "沙僧查水"],
          ["A07", "12-15s", "",             "那黑影贴着石阶溜入正殿，在王座阴影里停了片刻，出来了。出来的时候，地上多了一卷经书。",                             "王座下藏经"],
          ["A08", "15-18s", img.tang,       "唐僧在殿中拾起经书，展开，就着烛光念了起来。殿外，他的包袱还绑在马背上。",                                         "唐僧王座前诵经"],
          ["A09", "18-21s", "",             "沙僧牵马来寻师父，在殿门口停住。师父的包袱原封在马背，里头还鼓着，经书在里面。",                                   "包袱未动起疑"],
          ["A10", "21-24s", img.scripture,  "唐僧翻开第一页。金字整齐，行行端正，一字不差。往下翻。",                                                           "第一页佛文正常"]
        ]
      },
      {
        id: "act2",
        label: "困",
        range: "A11–A22",
        time: "24–60s",
        frames: [
          ["A11", "24-27s", img.scripture,  "翻到第二页，金字没了。页上生出新字，黑色，笔画朝四角爬。唐僧手没抖，继续往下念。",                               "经文变成黑色螺旋"],
          ["A12", "27-30s", img.lantern,    "唐僧念错了一个字。殿里所有烛火同时一闪，绿了。",                                                                   "烛火转绿"],
          ["A13", "30-33s", "",             "悟空蹲在子母河边，将金箍棒探入水。棒身红了一下，灭了。皱眉道：<span class='dialogue'>没有妖气。</span>低头看，脸色变了。", "悟空查河"],
          ["A14", "33-36s", img.hh005,      "子母河水面不动，平得像石。悟空俯身——水里没有云，没有月，只有黑色海底，海底有东西在往上看。",                       "水面倒映黑海"],
          ["A15", "36-39s", img.river,      "水底有一座塔，石身发黑。不是沉进去的，是一直在那里，等水漫上来。它往上看，看得清楚。",                             "沉没佛塔"],
          ["A16", "39-42s", "",             "悟空捞起一朵莲花，翻过来，扔了出去。没说话。",                                                                     "莲花眼孔"],
          ["A17", "42-45s", "",             "八戒把手探入子母河，摸了半天，站起来道：<span class='dialogue'>大师兄，底下没有娃娃。</span>悟空道：<span class='dialogue'>我知道。</span>", "悟空验水"],
          ["A18", "45-48s", "",             "悟空将金箍棒探到底，棒身渐渐暗红，不再变色。道：<span class='dialogue'>底下连着同一根东西。</span>把棒拔出来，看向城里。", "金箍棒探水"],
          ["A19", "48-51s", "",             "悟空蘸了点河水，在石阶上画了一道线。线干了，石阶留下细纹，朝城里伸。他把线抹掉，站起来。",                         "根须分裂图"],
          ["A20", "51-54s", "",             "悟空取出照妖镜，对准水面，镜里一片白。对了三次，白了三次。悟空一棒砸下去，道：<span class='dialogue'>没有妖怪。</span>", "照妖镜破裂"],
          ["A21", "54-57s", "",             "破镜碎片里浮出一行红字。悟空看了半天，认不出。那字一直在看他。",                                                   "镜中红字"],
          ["A22", "57-60s", "",             "金箍突然一紧。悟空往城里数了一遍，再数一遍。数不对。",                                                             "金箍报警"]
        ]
      },
      {
        id: "act3",
        label: "破",
        range: "A23–A32",
        time: "60–88s",
        frames: [
          ["A23", "60-63s", "",             "悟空挨个数影子：师父一个，沙师弟一个，白龙马没有，八戒没有。数了两遍，结果一样。",                               "师徒影子异常"],
          ["A24", "63-66s", img.shadow,     "子母河边，一个黑影跪着低头喝水。八戒就站在悟空身边，看着自己的影子喝水，没动。",                                   "八戒影子饮水"],
          ["A25", "66-69s", img.lantern,    "三更鼓声落，女儿国所有宫灯同时灭了。不是风。全城同时，一刻不差。",                                               "宫灯齐灭"],
          ["A26", "69-72s", "",             "宫女们登上城墙，面朝西方，齐声开口。悟空站了半天，铁青着脸道：<span class='dialogue'>这不是佛经。</span>",          "城墙诵经"],
          ["A27", "72-75s", img.scripture,  "她们念的，是唐僧念错的那一页。念完一遍，再从头。唐僧在殿内，合上经书，没动。",                                     "错误经页回响"],
          ["A28", "75-78s", "",             "念一遍，全城腹部发一次光，同步深一分。念一遍，深一分。城里女人立在原地，等着。",                                   "腹光同步"],
          ["A29", "78-81s", "",             "女王坐在王座上，腹里发光，一明一暗。唐僧走近，听了一会儿，退后一步。里面那个声音，不是她的，也不是孩子的。",       "女王腹中异声"],
          ["A30", "81-84s", "",             "那声音道：<span class='dialogue'>别去西天。</span>说完，静了，光也灭了。女王坐在王座上，眼睛闭着。",               "黑场低语"],
          ["A31", "84-86s", "",             "唐僧在殿里站了很久。合上经书，放回王座阴影里，原来的位置。走出殿门，对徒弟道：<span class='dialogue'>走了。</span>", "如来神庙"],
          ["A32", "86-88s", "",             "子母河边，那只黑影还跪在那里喝水。师徒四人路过，没有回头。影子抬起头，看了看，又低下去。",                         "影子回望"]
        ]
      }
    ];

    function mediaNode(src, label) {
      if (!src) return `<div class="missing">${label}</div>`;
      if (src.endsWith(".mp4")) return `<video controls src="${src}"></video>`;
      return `<img src="${src}" alt="${label}">`;
    }

    function render() {
      const root = document.getElementById("chapters");
      root.innerHTML = acts.map(act => `
        <section class="chapter" id="${act.id}">
          <div class="chapter-head">
            <span class="act-label">${act.label}</span>
            <span class="act-range">${act.range}</span>
            <span class="act-time">${act.time}</span>
          </div>
          <div class="strip">
            ${act.frames.map(frame => `
              <article class="frame">
                <div class="frame-top">
                  <span class="id">${frame[0]}</span>
                  <span class="time">${frame[1]}</span>
                </div>
                <div class="picture">
                  ${mediaNode(frame[2], frame[4])}
                  <span class="tag">${frame[4]}</span>
                </div>
                <div class="caption">
                  <p>${frame[3]}</p>
                </div>
              </article>
            `).join("")}
          </div>
        </section>
      `).join("");
    }

    render();
  </script>
</body>
</html>
