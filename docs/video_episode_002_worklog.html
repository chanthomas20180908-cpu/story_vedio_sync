    const typeLabel = {
      story: "故事",
      visual: "视觉",
      video: "视频",

    function monthKey(date) {
      return date.slice(0, 7);
    }

    function dayLabel(date) {
      return date.split("-").slice(1).join(".");
    }

    function renderFilters() {
      const stages = [...new Set(records.map(r => r.stage))];
      document.getElementById("stage").innerHTML = '<option value="">全部阶段</option>' + stages.map(s => `<option value="${s}">${s}</option>`).join("");
    }

    function linkList(items) {
      return `<div class="links">${items.map(item => `<a href="${item[1]}">${item[0]}</a>`).join("")}</div>`;
    }

    function recordNode(r) {
      return `
        <details class="record ${r.type}">
          <summary>
            <div class="summary-top">
              <div class="summary-title">
                <div class="meta">
                  <span class="pill hot">${r.id}</span>
                  <span class="pill">${r.stage}</span>
                  <span class="pill ${r.type === "video" ? "cyan" : r.type === "visual" ? "green" : r.type === "story" ? "red" : ""}">${typeLabel[r.type]}</span>
                </div>
                <h3>${r.title}</h3>
                <div class="desc">${r.summary}</div>
              </div>
              <div class="arrow">›</div>
            </div>
          </summary>
          <div class="body">
            <div class="detail-grid">
              <div class="box"><span class="label">目的</span><p>${r.purpose}</p></div>
              <div class="box"><span class="label">输入</span><p>${r.input}</p></div>
              <div class="box"><span class="label">产出</span><p>${r.output}</p></div>
              <div class="box"><span class="label">结论</span><p>${r.conclusion}</p></div>
              <div class="box"><span class="label">下一步</span><p>${r.next}</p></div>
              <div class="box"><span class="label">证据 / 文件</span>${linkList(r.links)}</div>
            </div>
          </div>
        </details>
      `;
    }

    function render() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const stage = document.getElementById("stage").value;
      const type = document.getElementById("type").value;
      const filtered = records.filter(r => {
        const hay = Object.values(r).flat().join(" ").toLowerCase();
        return (!q || hay.includes(q)) && (!stage || r.stage === stage) && (!type || r.type === type);
      });

      const groups = {};
      filtered.forEach(r => {
        const mk = monthKey(r.date);
        groups[mk] ||= {};
        groups[mk][r.date] ||= [];
        groups[mk][r.date].push(r);
      });

      const html = Object.keys(groups).sort().reverse().map(month => `
        <section class="month">
          <div class="month-head">
            <h2>${month.replace("-", " 年 ")} 月</h2>
            <span>${Object.values(groups[month]).flat().length} records</span>
          </div>
          ${Object.keys(groups[month]).sort().reverse().map(date => `
            <div class="day">
              <aside class="date"><strong>${dayLabel(date)}</strong><span>${date}</span></aside>
              <div class="line">${groups[month][date].map(recordNode).join("")}</div>
            </div>
          `).join("")}
        </section>
      `).join("");

      document.getElementById("timeline").innerHTML = html;
      document.getElementById("empty").style.display = filtered.length ? "none" : "block";
    }

    renderFilters();
    render();
    document.getElementById("search").addEventListener("input", render);
    document.getElementById("stage").addEventListener("change", render);
    document.getElementById("type").addEventListener("change", render);
  </script>
